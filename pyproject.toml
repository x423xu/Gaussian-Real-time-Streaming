[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-real-time-streaming"
version = "0.1.0"
description = "Realtime streaming utilities for 3D/4D Gaussian Splatting."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "Pillow",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
