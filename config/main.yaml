defaults:
  - dataset: re10k_unposed
  - model: rtgs_model
  - optional dataset/view_sampler_dataset_specific_config: ${dataset/view_sampler}_${dataset}
  - _self_

mode: inspect_dataset
seed: 111123
output_dir: outputs/rtgs

dataset:
  name: re10k_unposed
  roots: [/data0/xxy/data/re10k]
  split: test
  config_path: config/dataset/re10k_unposed.yaml
  overfit_to_scene: null
  image_shape: [256, 256]
  da3_image_shape: [336, 336]
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 4
  seed: 111123

train:
  steps: 2000
  batch_size: 2
  lr: 1.0e-4
  min_lr: 1.0e-8
  warmup_steps: 4000
  log_every: 10
  save_checkpoint: true
  checkpoint_every: null

eval:
  checkpoint_path: null
  evaluation_index_path: null
  every_n_steps: 5000
  eval_data_interval: 10
  max_batches: null
  save_renderings: true
  save_rendering_limit: 8

runtime:
  device: cuda:2
  conda_env: rtgs
  remote_host: malab
  remote_root: /data0/xxy/code/Gaussian-Real-time-Streaming

wandb:
  enabled: false
  entity: xxy
  project: rtgs
  name: null
  mode: online
  tags: []
